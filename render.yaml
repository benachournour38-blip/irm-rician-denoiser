services:
  - type: web
    name: irm-rician-denoiser
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MRI_ACCESS_PASSWORD
        value: Radiologie2026!
